[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factoring-lakehouse"
version = "0.1.0"
description = "Invoice-factoring lakehouse: Databricks (Spark/Delta) + Snowflake + dbt + Airflow"
requires-python = ">=3.10"
dependencies = [
  "pyspark==3.5.3",
  "delta-spark==3.2.1",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.scripts]
# Entry points used by Databricks python_wheel_task and by Airflow.
pipeline = "factoring_lakehouse.pipeline:main"
snowflake-load = "factoring_lakehouse.snowflake_io.loader:main"
factoring-datagen = "factoring_lakehouse.datagen:main"

[project.optional-dependencies]
dev = ["pytest>=8", "behave>=1.2.6", "ruff>=0.5", "sqlfluff>=3.0"]
sources = ["psycopg[binary]>=3.1", "pymongo>=4.6"]
snowflake = ["snowflake-connector-python>=3.10"]
dbt = ["dbt-snowflake>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["databricks/notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
# The repo has an `airflow/` folder; the `airflow` import is the third-party package.
known-third-party = ["airflow"]
known-first-party = ["factoring_lakehouse"]
