resources:
  jobs:
    factoring_medallion:
      name: factoring-medallion-${bundle.target}
      description: Bronze -> Silver -> Gold -> Snowflake export for the factoring lakehouse.
      max_concurrent_runs: 1          # MERGE targets are not safe for concurrent writers
      timeout_seconds: 7200
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 3600
      email_notifications:
        on_failure: ["${var.alert_email}"]
        on_duration_warning_threshold_exceeded: ["${var.alert_email}"]
      parameters:
        - name: batch_id
          default: "{{job.start_time.iso_date}}"
        - name: as_of
          default: "{{job.start_time.iso_date}}"

      job_clusters:
        - job_cluster_key: etl
          new_cluster:
            spark_version: 15.4.x-scala2.12     # LTS runtime
            node_type_id: m6gd.xlarge           # Graviton + local NVMe for Delta cache
            runtime_engine: PHOTON
            data_security_mode: SINGLE_USER     # Unity Catalog
            autoscale:
              min_workers: 1
              max_workers: 6
            aws_attributes:
              availability: SPOT_WITH_FALLBACK
              first_on_demand: 1
            spark_env_vars:
              FACTORING_ENV: databricks
              FACTORING_CONFIG: /Workspace${workspace.file_path}/conf/pipeline.databricks.yaml
            spark_conf:
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "auto"

      tasks:
        - task_key: bronze
          job_cluster_key: etl
          python_wheel_task:
            package_name: factoring_lakehouse
            entry_point: pipeline
            parameters: ["--batch", "{{job.parameters.batch_id}}", "--as-of", "{{job.parameters.as_of}}",
                         "--layer", "bronze"]
          libraries: [{whl: ../dist/*.whl}]
          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: silver
          depends_on: [{task_key: bronze}]
          job_cluster_key: etl
          python_wheel_task:
            package_name: factoring_lakehouse
            entry_point: pipeline
            parameters: ["--batch", "{{job.parameters.batch_id}}", "--as-of", "{{job.parameters.as_of}}",
                         "--layer", "silver"]
          libraries: [{whl: ../dist/*.whl}]
          max_retries: 1                 # DQ threshold breaches should page a human, not loop

        - task_key: gold
          depends_on: [{task_key: silver}]
          job_cluster_key: etl
          python_wheel_task:
            package_name: factoring_lakehouse
            entry_point: pipeline
            parameters: ["--as-of", "{{job.parameters.as_of}}", "--layer", "gold"]
          libraries: [{whl: ../dist/*.whl}]

        - task_key: export_to_snowflake_stage
          depends_on: [{task_key: gold}]
          job_cluster_key: etl
          python_wheel_task:
            package_name: factoring_lakehouse
            entry_point: pipeline
            parameters: ["--as-of", "{{job.parameters.as_of}}", "--layer", "export"]
          libraries: [{whl: ../dist/*.whl}]

        - task_key: optimize_maintenance
          depends_on: [{task_key: export_to_snowflake_stage}]
          job_cluster_key: etl
          notebook_task:
            notebook_path: ../notebooks/maintenance.py
            base_parameters:
              lakehouse_root: ${var.lakehouse_root}

      # Airflow triggers this job in production; the schedule below is only active in dev for demos.
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: PAUSED

  pipelines:
    factoring_dlt:
      name: factoring-dlt-${bundle.target}
      catalog: ${var.catalog}
      target: silver
      serverless: true
      photon: true
      channel: CURRENT
      continuous: false
      libraries:
        - file:
            path: ../dlt/factoring_dlt.py
      configuration:
        factoring.landing_root: ${var.landing_root}
